  const end = (e) => { if (e.pointerId !== pid) return; pid = null; inp[k] = 0; el.classList.remove('on'); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); el.addEventListener('lostpointercapture', end);
}
const keys = new Set(); addEventListener('keydown', (e) => keys.add(e.code)); addEventListener('keyup', (e) => keys.delete(e.code));
$('carimg').src = CAR.c;

async function main() {
  let SV;
  try { SV = await google.maps.importLibrary('streetView'); } catch (e) { return fail('Could not load Google Maps: ' + e.message); }
  const { StreetViewPanorama, StreetViewService, StreetViewSource, StreetViewPreference } = SV;
  const svc = new StreetViewService();
  let start;
  try { start = await svc.getPanorama({ location: START, radius: 80, source: StreetViewSource.OUTDOOR, preference: StreetViewPreference.NEAREST }); }
  catch (e) { return fail('No Street View found near HaPisga (or the key is not allowed for Street View).<br><small>' + (e.code || e.message) + '</small>'); }
  const pano = new StreetViewPanorama($('pano'), {
    pano: start.data.location.pano, pov: { heading: 0, pitch: -4 }, zoom: 0,
    disableDefaultUI: true, linksControl: false, clickToGo: false, scrollwheel: false, showRoadLabels: false,
    motionTracking: false, motionTrackingControl: false, addressControl: false, fullscreenControl: false, panControl: false, zoomControl: false, enableCloseButton: false,
  });
  let links = start.data.links || [];
  let heading = links.length ? links[0].heading : 0;
  pano.addListener('links_changed', () => { links = pano.getLinks() || []; });
  pano.addListener('status_changed', () => { if (pano.getStatus() !== 'OK') toast('Street View: ' + pano.getStatus()); });
  pano.addListener('pano_changed', () => {
    const loc = pano.getLocation(); const d = start.data.imageDate;
    if (loc && loc.description) { const he = loc.description.split(',')[0]; $('sthe').textContent = he; }
  });
  if (start.data.imageDate) $('date').textContent = 'Imagery: ' + start.data.imageDate;
  setTimeout(() => $('msg').classList.add('done'), 600);

  let speed = 0, dist = 0, last = performance.now(), povH = heading, steerV = 0, hopT = 0, cooldown = 0;
  const STEP = 9; // approx metres between panoramas
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const gas = Math.max(inp.gas, keys.has('ArrowUp') || keys.has('KeyW') ? 1 : 0), brake = Math.max(inp.brake, keys.has('ArrowDown') || keys.has('KeyS') ? 1 : 0);
    const steer = (inp.r || keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0) - (inp.l || keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0);
    steerV += (steer - steerV) * Math.min(1, dt * 8);
    if (gas) speed += 4.5 * dt * (1 - speed / 15);
    if (brake) speed -= (speed > 0.3 ? 9 : 3) * dt;
    speed -= Math.sign(speed) * Math.min(Math.abs(speed), (0.6 + speed * speed * 0.004) * dt);
    speed = Math.max(-4, Math.min(15, speed));
    const moving = Math.abs(speed) > 0.2;
    heading = (heading + steerV * (moving ? 70 : 40) * dt + 360) % 360; // can look around when stopped
    // find link most aligned with travel direction
    const want = speed >= 0 ? heading : (heading + 180) % 360;
    let best = null, bd = 999; for (const lk of links) { const d = Math.abs(angDiff(want, lk.heading)); if (d < bd) { bd = d; best = lk; } }
    // road-following assist
    if (best && moving && bd < 40 && Math.abs(steerV) < 0.3) { const tgt = speed >= 0 ? best.heading : (best.heading + 180) % 360; heading = (heading + angDiff(heading, tgt) * Math.min(1, dt * 1.6) + 360) % 360; }
    cooldown -= dt;
    if (moving) dist += Math.abs(speed) * dt;
    if (dist >= STEP && cooldown <= 0) {
      if (best && bd < 70) { pano.setPano(best.pano); hopT = 1; cooldown = 0.25; }
      else { speed = 0; toast('End of the road — turn around'); }
      dist = 0;
    }
    povH += angDiff(povH, heading) * Math.min(1, dt * 6);
    // fake forward motion between hops: gently zoom in as we approach the next panorama
    const zoom = Math.max(0, (dist / STEP) * 0.55 * (speed >= 0 ? 1 : 0));
    pano.setPov({ heading: povH, pitch: -4 + Math.min(3, Math.abs(speed) * 0.15) });
    pano.setZoom(zoom);
    hopT *= Math.exp(-dt * 6);
    $('carimg').src = steerV > 0.35 ? CAR.r : steerV < -0.35 ? CAR.l : CAR.c;
    $('car').style.transform = `translateX(calc(-50% + ${steerV * 10}px)) rotate(${steerV * 2.5}deg) translateY(${Math.sin(now * 0.02) * Math.min(1, Math.abs(speed) / 6) * 1.2 + hopT * 4}px)`;
    $('speed').textContent = Math.round(Math.abs(speed) * 3.6);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
main().catch((e) => fail('Error: ' + e.message));
</script>
